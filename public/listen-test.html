<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Listen test</title>
<style>body{font:17px Arial,sans-serif;padding:16px;background:#faf8f2;color:#1e3722}button{display:block;width:100%;margin:10px 0;padding:14px;font:600 17px Arial;border:1px solid #2f5233;border-radius:8px;background:#fff;color:#1e3722}#log{font:13px monospace;white-space:pre-wrap;background:#fff;padding:8px;border-radius:6px}</style></head>
<body>
<h2>Listen test, version 2 (temporary)</h2>
<p>Reload this page before each button. Tap one button, wait a moment, and note whether you <b>hear</b> it.</p>
<button id="b6">6. Speech, no cancel</button>
<button id="b7">7. Speech, "playback" audio</button>
<button id="b8">8. Speech, "ambient" audio</button>
<button id="b9">9. Speech, "transient" audio</button>
<button id="b10">10. Beep, then speech after 1 second</button>
<div id="log"></div>
<script>
var L=document.getElementById('log');function log(t){L.textContent+=t+'\n';}
var S=window.speechSynthesis, AS=navigator.audioSession;
function say(n){var u=new SpeechSynthesisUtterance('Test number '+n+'. This is the Pedaver listen test.');u.lang='en-US';u.volume=1;
 var t0=Date.now();u.onstart=function(){log(n+': started')};u.onend=function(){log(n+': ended after '+(Date.now()-t0)+' ms')};u.onerror=function(e){log(n+': error '+e.error)};
 S.speak(u);log(n+': speak called; audioSession='+(AS?AS.type+'/'+AS.state:'none'));}
function setType(t){if(AS){try{AS.type=t;log('audioSession set to '+AS.type)}catch(e){log('audioSession error '+e)}}else log('no audioSession API');}
document.getElementById('b6').onclick=function(){say(6)};
document.getElementById('b7').onclick=function(){setType('playback');say(7)};
document.getElementById('b8').onclick=function(){setType('ambient');say(8)};
document.getElementById('b9').onclick=function(){setType('transient');say(9)};
document.getElementById('b10').onclick=function(){var a=new Audio('/audio/beep-test.wav');a.play().then(function(){log('beep: playing')}).catch(function(e){log('beep: blocked '+e.name)});setTimeout(function(){say(10)},1000)};
log('voices: '+S.getVoices().length+'; '+navigator.userAgent.replace(/.*\((.*?)\).*Version\/([\d.]+).*/,'$1 · Safari $2')+'; audioSession='+(AS?AS.type+'/'+AS.state:'none'));
</script></body></html>
