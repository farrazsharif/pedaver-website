name: Build and deploy to cPanel

# Runs on every push to the main branch, and can also be run manually
# from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels an in-progress one.
concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the deploy script can diff the current commit
          # against the last successful deploy's commit (incremental media).
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GSC_VERIFICATION }}

      - name: Add .htaccess to the build
        run: cp docs/htaccess.txt out/.htaccess

      # Deploy over the cPanel API on port 2083 — NOT FTP, NOT SSH.
      #
      # FTP (SamKirkland/FTP-Deploy-Action) was the previous method; it works
      # but depends on SkyHost's FTP passive-port firewall config, which kept
      # resetting (broke 2026-09-10 and 2026-09-26). SSH/rsync isn't an option
      # either (SSH port firewalled + shell access disabled on the account).
      # The cPanel API on :2083 answers reliably from outside, so we deploy
      # through it. The old FTP step is preserved in git history (commit
      # 45defe1) as a fallback. See scripts/deploy-cpanel.sh for how the
      # incremental upload works, and docs/pqnk-book-workflow.md for context.
      #
      # Required repo secrets: CPANEL_USER, CPANEL_TOKEN (a cPanel API token
      # created under Security -> Manage API Tokens for user caremidc).
      - name: Deploy to cPanel via API
        env:
          CPANEL_HOST: cpanel.pedaver.com
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          DOCROOT_REL: pedaver.com
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Last successful FTP deploy (run #336) — baseline for the first
          # API run so it doesn't try to re-upload the whole 1.1 GB site.
          FALLBACK_BASE: 87b24491a3de53315209bce9ba79bfef928b65a8
        run: bash scripts/deploy-cpanel.sh
