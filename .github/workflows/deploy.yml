name: Build and deploy to cPanel

# Runs on every push to the main branch, and can also be run manually
# from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels an in-progress one.
concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GSC_VERIFICATION }}

      - name: Add .htaccess to the build
        run: cp docs/htaccess.txt out/.htaccess

      # Deploy over SSH (rsync), NOT FTP.
      #
      # Re-enabled 2026-09-11: FTPS is still blocked by the host's FTP
      # passive-port firewall (retest #227 timed out on the data connection
      # again after the server restart). rsync-over-SSH uses ONE connection
      # on the SSH port with no passive data ports, so it sidesteps that
      # firewall entirely. In earlier tests (#221/#222) the SSH connection
      # and key auth succeeded on ports 5122 and 22; if this run fails, read
      # the rsync error at the bottom of this step to see the remaining cause.
      #
      # Secrets: SSH_HOST, SSH_USER, SSH_PORT (5122), DEPLOY_PATH
      # (/home/caremidc/pedaver.com/), SSH_PRIVATE_KEY (public half authorized
      # in the cPanel account's ~/.ssh/authorized_keys).
      - name: Deploy to cPanel over SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          # Trailing slash on SOURCE = copy the CONTENTS of out/ into TARGET.
          SOURCE: "out/"
          TARGET: ${{ secrets.DEPLOY_PATH }}
          # No --delete yet: it would prune anything in the doc root not in
          # out/. Add it later, once confirmed the doc root holds only the
          # built site, to mirror exactly and remove stale pages.
          ARGS: "-rltvz"
          EXCLUDE: ".git/, .github/, node_modules/"
