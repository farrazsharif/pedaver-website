name: Build and deploy to cPanel

# Runs on every push to the main branch, and can also be run manually
# from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Add .htaccess to the build
        run: cp docs/htaccess.txt out/.htaccess

      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The built site lives in out/ ; upload its CONTENTS.
          local-dir: ./out/
          # pedaver.com is an ADDON domain whose document root is /pedaver.com
          # (a folder in the account home, beside public_html). This path is
          # relative to the FTP account's home, so the FTP user MUST be the
          # main cPanel account (home = /home/<user>/), not one locked to
          # public_html — otherwise it can't reach this folder.
          server-dir: pedaver.com/
          # If the host requires encrypted FTP, change to: ftps
          protocol: ftp
