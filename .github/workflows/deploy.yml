name: Build and deploy to cPanel

# Runs on every push to the main branch, and can also be run manually
# from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time. If a second push lands while a deploy is
# running, the in-progress one is cancelled and the newest wins — this
# prevents the racing-deploy collision seen on 2026-09-10 (runs #216/#217).
concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GSC_VERIFICATION }}

      - name: Add .htaccess to the build
        run: cp docs/htaccess.txt out/.htaccess

      # Deploy via FTPS (reverted 2026-09-11 — see commit message).
      #
      # 2026-09-10: FTPS started failing ("Timeout when trying to open data
      # connection") during the same window pedaver.com's web server (LiteSpeed,
      # ports 80/443) went fully unreachable while cPanel/WHM/FTP/mail all
      # stayed up — a host-side outage, not a deploy problem. We tried
      # switching to SSH/rsync (easingthemes/ssh-deploy) instead; all 3 runs
      # (#220-#222) failed in 0.0s, which is the action rejecting its inputs
      # before it even opens a connection — almost certainly SSH_PRIVATE_KEY
      # is unset/invalid or its public half was never added to the cPanel
      # account's ~/.ssh/authorized_keys. That needs someone with cPanel
      # access to generate a real keypair and verify all 5 SSH_* secrets, so
      # it's parked. FTPS is back in the meantime since it deployed chapters
      # 1-8 successfully before the outage and the host issue should now be
      # resolved. The SSH step is preserved in git history at commit
      # a55b80a if someone wants to finish wiring it up properly later.
      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The built site lives in out/ ; upload its CONTENTS.
          local-dir: ./out/
          # The deploy@pedaver.com FTP account is scoped to the pedaver.com
          # document root, so we upload straight into its home directory.
          server-dir: ./
          # cPanel account uses explicit FTPS on port 21.
          protocol: ftps
