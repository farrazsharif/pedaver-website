version: 2
updates:
  # Node/npm dependencies (Next.js, React, build tooling).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps to keep noise down.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The GitHub Actions used by the deploy workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
